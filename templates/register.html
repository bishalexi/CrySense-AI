<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabyCry Sense AI - Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/login/style.css?v=2.0">
</head>
<body class="register-page">
  <div class="background-overlay"></div>

  <main class="registration-container">
    <section class="registration-header">
      <div class="brand-icon">👶</div>
      <h1>Create Your Account</h1>
      <p>Register to start monitoring with BabyCry Sense AI</p>
    </section>

    <form id="registerForm" class="registration-form">
      <div class="two-column">
        <div class="input-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="e.g. Dr. Sarah Jenkins" required>
        </div>

        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" required>
        </div>
      </div>

      <div class="input-group">
        <label for="registerEmail">Email Address</label>
        <input type="email" id="registerEmail" placeholder="Enter your email" required>
      </div>

      <div class="two-column">
        <div class="input-group">
          <label for="phone">Phone Number (Optional)</label>
          <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
        </div>

        <div class="input-group">
          <label for="role">User Type</label>
          <select id="role" required>
            <option value="Parent" selected>Parent / Guardian</option>
            <option value="Caregiver">Pediatric Caregiver</option>
            <option value="Doctor">Neonatal Physician / Doctor</option>
            <option value="Researcher">Infant Acoustic Researcher</option>
          </select>
        </div>
      </div>

      <div class="two-column">
        <div class="input-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" placeholder="Create a password (min 6 chars)" required>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="terms" checked required>
        <span>I agree to the Terms & Conditions and Privacy Policy for infant telemetry.</span>
      </label>

      <button type="submit" class="primary-btn">
        <span>Create Account & Launch Monitor</span>
        <span>→</span>
      </button>

      <p id="registerMessage" class="message"></p>

      <p class="login-link">
        Already have an account?
        <a href="/login">Back to Login</a>
      </p>
    </form>
  </main>

  <script src="/static/login/script.js?v=2.0"></script>
</body>
</html>
