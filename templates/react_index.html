<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BabyCry AI — 3D Multimodal Infant Distress Monitor</title>
    <meta name="description" content="AI-Powered Multimodal Infant Distress Monitor combining Face Emotion AI with BabyCry Acoustics." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- Global React/react safety shims -->
    <script>
        window.React = window.React || {};
        window.react = window.React;
        window.ReactDOM = window.ReactDOM || {};
        window.reactDom = window.ReactDOM;
        window.addEventListener("error", function(e) {
            if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #07090e;
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
        }
        .btn-mini {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-mini:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(0, 212, 255, 0.4);
        }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script defer src="/static/js/bundle.js?v=10.0"></script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>
</html>
