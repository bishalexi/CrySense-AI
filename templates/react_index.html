<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BabyCry AI — 3D Multimodal Infant Distress Monitor</title>
    <meta name="description" content="AI-Powered Multimodal Infant Distress Monitor combining Face Emotion AI with BabyCry Acoustics." />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="apple-touch-icon" href="/static/images/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <!-- Global React/react safety shims -->
    <script>
        window.React = window.React || {};
        window.react = window.React;
        window.ReactDOM = window.ReactDOM || {};
        window.reactDom = window.ReactDOM;
        window.addEventListener("error", function(e) {
            if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --background: 340 100% 98%;
            --foreground: 335 45% 20%;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #fff5f8 !important;
            background-image: url('/static/baby_bg.jpg') !important;
            background-repeat: repeat !important;
            background-size: 380px auto !important;
            background-attachment: fixed !important;
            background-position: top center !important;
            color: #1e293b !important;
            font-family: 'Quicksand', 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .App {
            background-color: transparent !important;
            background-image: url('/static/baby_bg.jpg') !important;
            background-repeat: repeat !important;
            background-size: 380px auto !important;
            background-attachment: fixed !important;
            background-position: top center !important;
            color: #1e293b !important;
            min-height: 100vh;
            position: relative;
        }

        /* Soft ambient canvas so the custom baby illustration wallpaper is crisp and clearly visible */
        canvas {
            z-index: 1 !important;
            pointer-events: none !important;
            opacity: 0.22 !important;
        }

        .content-wrap {
            position: relative;
            z-index: 5 !important;
        }

        /* Sweet White & Pink Glassmorphism Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.90) !important;
            border: 2px solid rgba(244, 114, 182, 0.35) !important;
            border-radius: 20px !important;
            backdrop-filter: blur(18px) !important;
            -webkit-backdrop-filter: blur(18px) !important;
            box-shadow: 0 16px 36px rgba(244, 114, 182, 0.16), 0 2px 10px rgba(0, 0, 0, 0.04) !important;
            color: #1e293b !important;
        }

        .card-header {
            background: linear-gradient(135deg, rgba(253, 242, 248, 0.98), rgba(252, 231, 243, 0.90)) !important;
            border-bottom: 1.5px solid rgba(244, 114, 182, 0.25) !important;
            padding: 14px 20px !important;
        }

        .card-title {
            color: #831843 !important; /* Rich raspberry rose */
            font-weight: 700 !important;
            font-family: 'Quicksand', sans-serif !important;
            font-size: 0.96rem !important;
        }

        .card-subtle {
            color: #be185d !important;
            font-weight: 700 !important;
        }

        /* Top Header Bar in Sweet Pink & Cloud White */
        header {
            background: rgba(255, 255, 255, 0.92) !important;
            backdrop-filter: blur(20px) !important;
            border-bottom: 2.5px solid rgba(244, 114, 182, 0.35) !important;
            box-shadow: 0 6px 24px rgba(244, 114, 182, 0.15) !important;
        }

        /* Buttons in Vibrant Baby Pink */
        .btn-mini {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.7) !important;
            color: #ffffff !important;
            padding: 8px 18px !important;
            border-radius: 14px !important;
            font-size: 0.82rem !important;
            font-weight: 700 !important;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35) !important;
            transition: all 0.2s ease !important;
        }
        .btn-mini:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.45) !important;
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%) !important;
        }

        /* Footer in Sweet White/Pink */
        .foot {
            background: rgba(255, 255, 255, 0.88) !important;
            border-top: 2px solid rgba(244, 114, 182, 0.25) !important;
            color: #9d174d !important;
            font-weight: 600 !important;
        }
        .foot strong {
            color: #831843 !important;
        }

        /* Custom gentle baby pink scrollbar */
        ::-webkit-scrollbar {
            width: 9px;
        }
        ::-webkit-scrollbar-track {
            background: #fdf2f8;
        }
        ::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 6px;
            border: 2px solid #fdf2f8;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ec4899;
        }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script defer src="/static/js/bundle.js?v=14.0"></script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- User Session & Logout Navigation Bar -->
    <div id="crysenseUserBar" style="position: fixed; top: 16px; right: 20px; z-index: 9999; display: flex; align-items: center; gap: 8px; font-family: 'Quicksand', sans-serif;">
        <div style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1.5px solid rgba(244, 114, 182, 0.45); border-radius: 9999px; padding: 6px 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(244, 114, 182, 0.22); font-size: 0.82rem; font-weight: 700; color: #831843;">
            <span style="font-size: 1.05rem;">👶</span>
            <span id="userDisplayName">Parent Account</span>
            <span style="width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px #10b981; display: inline-block;"></span>
        </div>
        <button onclick="handleLogout()" title="Log out and return to front login page" style="background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 9999px; padding: 7px 15px; font-size: 0.78rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(225, 29, 72, 0.32); transition: all 0.2s ease;">
            <span>Log Out</span>
            <span style="font-size: 0.9rem;">↪</span>
        </button>
    </div>

    <script>
        async function initUserSession() {
            try {
                let user = null;
                const local = localStorage.getItem('babycry_user');
                if (local) {
                    try { user = JSON.parse(local); } catch(e) {}
                }
                if (!user) {
                    const res = await fetch('/api/current_user');
                    const data = await res.json();
                    if (data.logged_in) user = data.user;
                }
                const nameEl = document.getElementById('userDisplayName');
                if (nameEl) {
                    if (user && (user.name || user.email)) {
                        nameEl.textContent = (user.name || user.email) + ' (' + (user.role || 'Parent') + ')';
                    } else {
                        nameEl.textContent = 'Caregiver (Demo)';
                    }
                }
            } catch (e) {
                console.warn('Session check:', e);
            }
        }

        async function handleLogout() {
            try {
                localStorage.removeItem('babycry_user');
                await fetch('/api/logout', { method: 'POST' });
            } catch (e) {}
            window.location.href = '/';
        }

        window.addEventListener('DOMContentLoaded', initUserSession);
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js').catch(err => console.log('SW failed', err));
            });
        }
    </script>
</body>
</html>
