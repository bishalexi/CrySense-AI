<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BabyCry Sense AI - Login</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/login/style.css?v=2.0">
</head>
<body class="login-page">
  <div class="background-overlay"></div>

  <main class="login-card">
    <div class="brand-icon">👶</div>
    <h1>BabyCry Sense AI</h1>
    <p class="subtitle">Baby Cry Detection & Monitoring System</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" value="parent@crysense.ai" required autocomplete="email">
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" value="BabyCare2026!" required autocomplete="current-password">
      </div>

      <div class="form-row">
        <label class="remember">
          <input type="checkbox" id="rememberMe" checked>
          <span>Remember me</span>
        </label>
        <a href="#" onclick="forgotPassword(event)">Forgot Password?</a>
      </div>

      <button type="submit" class="primary-btn">
        <span>Login to Monitor</span>
        <span>→</span>
      </button>

      <button type="button" id="demoLoginBtn" class="demo-btn">
        <span>🚀 1-Click Demo Login</span>
      </button>

      <p id="loginMessage" class="message"></p>
    </form>

    <div class="divider"><span>OR</span></div>

    <p class="register-text">
      Don't have an account?
      <a href="/register">Create Account</a>
    </p>
  </main>

  <script src="/static/login/script.js?v=2.0"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(err => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
